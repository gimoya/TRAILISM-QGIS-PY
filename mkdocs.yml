site_name: TRAILISM
site_description: QGIS Processing tools for trail design and geometry
repo_url: https://github.com/gimoya/TRAILISM-QGIS-PY

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - docs
        - .
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gimoya/TRAILISM-QGIS-PY

# NOTE: When adding a new tool, also update README.md:
# - Add tool to the list at the top
# - Add tool description in "Tools overview" section
# - Add sidecar .md file to "Sidecar docs" section
# The docs homepage (docs/index.md) includes README.md, so keeping README updated ensures the GitHub repo and docs site stay in sync.
nav:
  - Home: index.md
  - Tools:
      - 'TRAILISM: Corner Fillets (min/max radius)': tools/trailism-corner-fillets-min-max-radius.md
      - 'TRAILISM: Cross-Section Profiles': tools/trailism-cross-section-profiles.md
      - 'TRAILISM: Export Attribute Table to XLSX': tools/trailism-export-attribute-table-to-xlsx.md
      - 'TRAILISM: Find Curves': tools/trailism-find-curves.md
      - 'TRAILISM: GPX Checkpoint Times': tools/trailism-gpx-checkpoint-times.md
      - 'TRAILISM: Grade Corridor Chords': tools/trailism-grade-corridor-chords.md
      - 'TRAILISM: Raster Extrema to Points': tools/trailism-raster-extrema-to-points.md
      - 'TRAILISM: Raster Replace DSM with DEM': tools/trailism-raster-replace-dsm-with-dem.md
      - 'TRAILISM: Trail Shaping': tools/trailism-trail-shaping.md
      - 'TRAILISM: Tree peaks (Tiede local maxima)': tools/trailism-tree-peaks-tiede-local-maxima.md


